[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-deer-agent"
version = "0.1.0"
description = "A minimal DeerFlow-inspired agent built for learning"
requires-python = ">=3.12"
# 锁定 9.14.1：9.15+ 禁用了 Yandex 引擎，而 Yandex 是国内可直连、无需 VPN 的搜索后端。
dependencies = [
    "ddgs==9.14.1",
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "langchain-core>=1.6,<2.0",
    "langchain-mcp-adapters>=0.3.2,<0.4.0",
    "langchain-openai>=1.6,<2.0",
    "langgraph>=1.2.9,<1.3",
    "langgraph-checkpoint-sqlite>=3.1.1,<3.2",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.12,<3.0",
    "pyyaml>=6.0,<7.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.12,<3.0",
    "pytest>=8.4,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mini_deer_agent = ["skills/builtin/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
