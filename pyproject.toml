[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-deer-agent"
version = "0.1.0"
description = "A minimal DeerFlow-inspired agent built for learning"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16,<10.0",
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "langchain-core>=1.6,<2.0",
    "langchain-openai>=1.6,<2.0",
    "langgraph>=1.2.9,<1.3",
    "langgraph-checkpoint-sqlite>=3.1.1,<3.2",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.12,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.12,<3.0",
    "pytest>=8.4,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
